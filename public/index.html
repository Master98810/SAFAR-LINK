<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b55"><link rel="manifest" href="/manifest.json"><title>SAFAR LINK</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap"><header><div class="falcon">🦅</div><div><h1>SAFAR LINK</h1><p>Secure location sharing</p></div></header>
<section class="card"><h2>Create a location link</h2><label for="label">Link name</label><input id="label" value="My location" maxlength="60"><label for="duration">Link active for</label><select id="duration"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="180">3 hours</option><option value="720">12 hours</option><option value="1440">24 hours</option></select>
<label for="admin">Administrator key</label><input id="admin" type="password" placeholder="Enter your private admin key"><button id="create">Create link</button><p class="hint">The recipient's location is shared only after they explicitly agree and grant GPS permission.</p><div id="result"></div></section>
<footer>SAFAR LINK • Location is never accessed without permission</footer></main><script src="/home.js"></script></body></html>
